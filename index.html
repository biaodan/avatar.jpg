<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSCALE AI - Consultation</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: #f4f7f6; 
        }
        .card { 
            text-align: center; 
            width: 90%; 
            max-width: 400px; 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.08); 
        }
        .avatar { 
            width: 100px; 
            height: 100px; 
            border-radius: 50%; 
            margin: 0 auto 15px; 
            border: 3px solid #e1e1e1; 
            overflow: hidden; 
        }
        .avatar img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        .dept { 
            font-size: 13px; 
            color: #555; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 10px; 
        }
        .title { 
            font-size: 22px; 
            font-weight: bold; 
            color: #222; 
            margin-bottom: 15px; 
        }
        .text { 
            font-size: 15px; 
            color: #444; 
            line-height: 1.6; 
            margin-bottom: 25px; 
            text-align: left; 
        }
        .btn { 
            display: block; 
            background: #25D366; 
            color: white; 
            text-decoration: none; 
            padding: 18px; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 16px; 
            transition: background 0.3s; 
        }
        .btn:hover { 
            background: #128C7E; 
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 确保你上传的图片名字叫 avatar.png -->
        <div class="avatar"><img src="avatar.png" alt="Consultant"></div>
        <div class="dept">HR Department - NSCALE AI</div>
        <div class="title">Consultation Requested</div>
        <div class="text">
            Thank you for your interest in NSCALE AI services. Your inquiry has been received. 
            <br><br>
            A dedicated consultant has been assigned to provide you with the full program details and assist with your setup.
        </div>
        <!-- 点击按钮跳转到你的分流页面 -->
        <a href="https://svip1027.top/KDGH65DF" class="btn">Connect with Consultant (WhatsApp)</a>
    </div>
</body>
</html>
